# Purpose: Redis configuration file for n8n queue mode with production-ready settings
# Created/Updated: 2025-01-27
# Agent: BACKEND_AGENT

# Network configuration
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# General configuration
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""
databases 16

# Persistence - AOF (Append Only File) for durability
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF configuration - enabled for queue durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Memory management - configured for queue workloads
maxmemory-policy allkeys-lru
maxmemory-samples 5
maxmemory 256mb

# Lazy freeing
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
replica-lazy-flush no

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Performance optimization for queue workloads
hz 10
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes

# Security
# Password should be set via command line argument in docker-compose
# Example: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
# If password is set, update requirepass directive below:
# requirepass your-password-here

# Connection limits
maxclients 10000

# Latency monitoring
latency-monitor-threshold 100

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

