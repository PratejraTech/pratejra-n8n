# Purpose: Docker Compose topology for n8n with Postgres and Redis queue mode
# Created/Updated: 2025-01-27
# Agent: BACKEND_AGENT
version: "3.8"

services:
  postgres:
    image: postgres:16.6-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    env_file:
      - ./n8n.redis.env.example
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - n8n-network

  redis:
    image: redis:7-alpine
    container_name: n8n-redis
    restart: unless-stopped
    command: >
      sh -c "if [ -n \"$$REDIS_PASSWORD\" ]; then
        redis-server /usr/local/etc/redis/redis.conf --requirepass $$REDIS_PASSWORD;
      else
        redis-server /usr/local/etc/redis/redis.conf;
      fi"
    env_file:
      - ./n8n.redis.env.example
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --raw incr ping || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - n8n-network
    # Redis port only exposed internally - not to host
    # Uncomment the following if you need to access Redis from host for testing
    # ports:
    #   - "127.0.0.1:6379:6379"

  n8n:
    # NOTE: Pin this tag to the version you test and approve for your environment.
    image: n8nio/n8n:1.84.2
    container_name: n8n-main
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./n8n.redis.env.example
    environment:
      # Database configuration
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      
      # n8n basic configuration
      N8N_PORT: 5678
      N8N_METRICS: ${N8N_METRICS:-true}
      N8N_METRICS_INCLUDE_QUEUE_METRICS: ${N8N_METRICS_INCLUDE_QUEUE_METRICS:-true}
      N8N_DIAGNOSTICS_ENABLED: ${N8N_DIAGNOSTICS_ENABLED:-false}
      
      # Queue mode configuration
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      QUEUE_BULL_REDIS_DB: 0
      QUEUE_BULL_REDIS_CONNECTION_TIMEOUT: 10000
    ports:
      # Bind to localhost by default; override N8N_BIND_ADDR to expose.
      - "${N8N_BIND_ADDR:-127.0.0.1}:${N8N_HOST_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - n8n-network

  n8n-worker:
    # Worker instance for processing queued workflows
    image: n8nio/n8n:1.84.2
    container_name: n8n-worker
    restart: unless-stopped
    command: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./n8n.redis.env.example
    environment:
      # Database configuration (same as main instance)
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      
      # Queue mode configuration (same as main instance)
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      QUEUE_BULL_REDIS_DB: 0
      QUEUE_BULL_REDIS_CONNECTION_TIMEOUT: 10000
      
      # Worker-specific configuration
      N8N_METRICS: ${N8N_METRICS:-true}
      N8N_METRICS_INCLUDE_QUEUE_METRICS: ${N8N_METRICS_INCLUDE_QUEUE_METRICS:-true}
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'n8n worker' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - n8n-network

  queue-metrics-exporter:
    # Optional supplemental Redis queue metrics exporter
    image: python:3.11-slim
    container_name: queue-metrics-exporter
    restart: unless-stopped
    command: python /app/redis_queue_metrics_exporter.py
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: 0
      SCRAPE_INTERVAL_SECONDS: ${SCRAPE_INTERVAL_SECONDS:-30}
      # Option 1: Push to Push Gateway
      PROMETHEUS_PUSH_GATEWAY: ${PROMETHEUS_PUSH_GATEWAY:-}
      # Option 2: Expose HTTP endpoint for Prometheus scraping
      EXPOSE_HTTP_PORT: ${EXPOSE_HTTP_PORT:-9090}
    ports:
      - "${EXPOSE_HTTP_PORT:-9090}:9090"  # Expose metrics endpoint for Prometheus scraping
    volumes:
      - ../ops/scripts:/app
    networks:
      - n8n-network  # Same network as Redis and n8n for connectivity
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  n8n_data:

networks:
  n8n-network:
    driver: bridge

